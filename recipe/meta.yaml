{% set version = "1.3.2" %}
{% set python_min = "3.10" %}


package:
  name: nctoolkit
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/n/nctoolkit/nctoolkit-{{ version }}.tar.gz
  sha256: 8da13603450726fd216ce967b2de975df98bbc29a85a3fb57fcba43fab1748a4


build:
  number: 0
  skip: true  # [win]
  script: {{ PYTHON }} -m pip install . -vv

requirements:

  host:
    - python
    - pip
    - setuptools_scm
    - setuptools-git
    - setuptools

  run:
    - python
    - dill
    - cdo  <2.6.1 # [not win]
    - nco
    - datashader
    - multiprocess # [osx]
    - ncplot >=0.3.6
    - jupyter_bokeh >=3.0.7
    - geoviews <=1.14.0


test:
  imports:
    - nctoolkit

about:
  home: https://pmlmodelling.github.io/nctoolkit/
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Fast and easy analysis of netCDF data in Python

extra:
  recipe-maintainers:
    - robertjwilson
