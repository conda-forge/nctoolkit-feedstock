{% set version = "1.3.9" %}
{% set python_min = "3.10" %}

package:
  name: nctoolkit
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/n/nctoolkit/nctoolkit-{{ version }}.tar.gz
  sha256: 2001411f645d134ca436a9b2f3c3a716abb89e6fd51ab349e96bb5a0305f7c99

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools_scm
    - setuptools-git
    - setuptools
  run:
    - python >={{ python_min }}
    - dill
    - cdo <2.6.1
    - nco
    - libgdal-netcdf
    - datashader
    - multiprocess
    - ncplot >=0.3.6
    - jupyter_bokeh >=3.0.7
    - geoviews <=1.14.0

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - nctoolkit
  commands:
    - pip check

about:
  home: https://pmlmodelling.github.io/nctoolkit/
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Fast and easy analysis of netCDF data in Python

extra:
  recipe-maintainers:
    - robertjwilson
