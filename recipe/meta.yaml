{% set version = "1.3.7" %}
{% set python_min = "3.10" %}

package:
  name: nctoolkit
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/n/nctoolkit/nctoolkit-{{ version }}.tar.gz
  sha256: 94fbd4f879353a4cd918a8878e10ed7da102ac96357764418d2f79e879f0bb63

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools_scm
    - setuptools-git
    - setuptools
  run:
    - python >={{ python_min }}
    - dill
    - cdo <2.6.1
    - nco
    - datashader
    - ncplot >=0.3.6
    - jupyter_bokeh >=3.0.7
    - geoviews <=1.14.0

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - nctoolkit
  commands:
    - pip check

about:
  home: https://pmlmodelling.github.io/nctoolkit/
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Fast and easy analysis of netCDF data in Python

extra:
  recipe-maintainers:
    - robertjwilson
